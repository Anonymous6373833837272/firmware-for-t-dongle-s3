name: Compila Firmware Lilygo Corretto

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recupera il codice sorgente
        uses: actions/checkout@v3

      - name: Installa Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installa PlatformIO e librerie sistema
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Configurazione dipendenze Bruce
        run: |
          chmod +x deauth_setup.sh
          bash deauth_setup.sh

      - name: Esegui Compilazione T-Dongle S3
        run: pio run -e lilygo-t-dongle-s3

      - name: Salva il file BIN
        uses: actions/upload-artifact@v3
        with:
          name: Firmware-Lilygo-T-Dongle-S3
          path: .pio/build/lilygo-t-dongle-s3/firmware.bin

