name: Compila Firmware Lilygo

on:
  workflow_dispatch: # Questo pulsante ti permette di avviare la compilazione a mano

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recupera il codice sorgente
        uses: actions/checkout@v3

      - name: Installa Python
        uses: actions/setup-python@v4
        with:
          python-data: '3.9'

      - name: Installa PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Esegui Compilazione T-Dongle S3
        run: pio run -e lilygo-t-dongle-s3

      - name: Salva il file BIN
        uses: actions/upload-artifact@v3
        with:
          name: Firmware-Lilygo-T-Dongle-S3
          path: .pio/build/lilygo-t-dongle-s3/firmware.bin
permissions:
  
